name: CI

on:
  push:
  pull_request:

jobs:
  token-and-consumer-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 tests/gs_test.py
      - run: python3 tests/consumer_test.py
